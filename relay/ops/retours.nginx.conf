# Include in http{}; direct Internet connection, no upstream CDN/real_ip module.
limit_req_zone $binary_remote_addr zone=feedback_ip:1m rate=6r/m;
limit_req_zone $server_name zone=feedback_global:1m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=feedback_connections:1m;
limit_conn_zone $server_name zone=feedback_total:1m;
server {
    listen 80 default_server;
    server_name _;
    access_log off;
    error_log /dev/null crit;
    server_tokens off;
    client_header_timeout 5s;
    large_client_header_buffers 2 4k;
    return 404;
}
server {
    listen 80;
    server_name retours.179-237-102-19.sslip.io;
    access_log off;
    error_log /dev/null crit;
    server_tokens off;
    client_max_body_size 8k;
    client_header_timeout 5s;
    client_body_timeout 5s;
    large_client_header_buffers 2 4k;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/feedback-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://retours.179-237-102-19.sslip.io$request_uri; }
}
server {
    listen 443 ssl default_server;
    server_name retours.179-237-102-19.sslip.io;
    ssl_certificate /etc/letsencrypt/live/retours.179-237-102-19.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/retours.179-237-102-19.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    # Avoid request URI / headers / body in diagnostics.
    error_log /dev/null crit;
    client_max_body_size 8k;
    client_header_timeout 5s;
    client_body_timeout 5s;
    send_timeout 5s;
    keepalive_timeout 5s;
    keepalive_requests 20;
    large_client_header_buffers 2 4k;
    limit_req_status 429;
    limit_conn_status 429;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    if ($host != retours.179-237-102-19.sslip.io) { return 404; }
    location = /feedback {
        limit_req zone=feedback_ip burst=3 nodelay;
        limit_req zone=feedback_global burst=10 nodelay;
        limit_conn feedback_connections 4;
        limit_conn feedback_total 32;
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 12s;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_next_upstream off;
        # Allowlist removes ALL visitor address headers, including arbitrary names.
        proxy_pass_request_headers off;
        proxy_set_header Host retours.179-237-102-19.sslip.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Origin $http_origin;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Content-Encoding $http_content_encoding;
        proxy_set_header Access-Control-Request-Method $http_access_control_request_method;
        proxy_set_header Access-Control-Request-Headers $http_access_control_request_headers;
        proxy_pass http://127.0.0.1:9101;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 @unavailable;
    }
    location @unavailable {
        default_type application/json;
        return 503 '{"error":"relay_unavailable"}';
    }
    location / { return 404; }
}
